<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Few Bars</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Few Bars</h1>
  <p class="subtitle">Tap a key</p>

  <div id="durations" class="durations">
    <button class="duration" data-duration="whole">Whole</button>
    <button class="duration" data-duration="half">Half</button>
    <button class="duration active" data-duration="quarter">Crotchet</button>
    <button class="duration" data-duration="eighth">Quaver</button>
  </div>

  <div id="piano" class="piano">
    <button class="key" data-note="C4">C</button>
    <button class="key" data-note="D4">D</button>
    <button class="key" data-note="E4">E</button>
    <button class="key" data-note="F4">F</button>
    <button class="key" data-note="G4">G</button>
    <button class="key" data-note="A4">A</button>
    <button class="key" data-note="B4">B</button>
    <button class="key" data-note="C5">C</button>
  </div>

  <p id="message" class="message"></p>
  <p class="hint">Tap a note on the stave to correct it</p>
  <div id="melody" class="melody"></div>

  <div id="correction" class="correction hidden">
    <span id="correction-label" class="correction-label"></span>
    <div class="correction-buttons">
      <button id="pitch-up-btn">▲ Pitch</button>
      <button id="pitch-down-btn">▼ Pitch</button>
      <button class="correction-duration" data-duration="whole">Whole</button>
      <button class="correction-duration" data-duration="half">Half</button>
      <button class="correction-duration" data-duration="quarter">Crotchet</button>
      <button class="correction-duration" data-duration="eighth">Quaver</button>
      <button id="delete-note-btn">Delete</button>
      <button id="deselect-btn">Done</button>
    </div>
  </div>

  <div id="controls" class="controls">
    <button id="play-btn">Play</button>
    <button id="undo-btn">Undo</button>
    <label class="tempo-label">
      <input id="tempo-input" type="number" min="40" max="220" value="90" />
      bpm
    </label>
  </div>

  <div id="share" class="share">
    <input id="title-input" type="text" placeholder="Title (optional)" maxlength="40" />
    <input id="message-input" type="text" placeholder="Message (optional)" maxlength="80" />
    <button id="export-btn">Export / Share</button>
  </div>

  <img id="card-preview" class="card-preview" alt="" />

  <hr class="divider" />

  <div id="hum" class="hum">
    <h2 class="hum-title">Hum a note</h2>
    <button id="hum-btn">Start humming</button>
    <p id="pitch-readout" class="pitch-readout">&mdash;</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
